name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). It builds the make dist tarball and one package per
# distribution release and architecture; make downloads the current
# Mojolicious from CPAN in each build. Read-only: nothing here writes the
# repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  tarball:
    uses: oposs/repo-infra/.github/workflows/ri-release-source-tarball.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}

  packages:
    uses: oposs/repo-infra/.github/workflows/ri-release-distro-packages.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      # Every release but Alpine: nfpm 2.47.0 in repo-infra v2 builds apk
      # packages apk-tools refuses (goreleaser/nfpm#1112). Back to all
      # releases, and the apk lines in release_assets, once
      # oposs/repo-infra#169 is released.
      distributions: >-
        debian-12 debian-13 ubuntu-22.04 ubuntu-24.04 ubuntu-26.04
        almalinux-9 almalinux-10 fedora
